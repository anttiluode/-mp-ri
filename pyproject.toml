[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mpri-fluid"
version = "0.1.0"
description = "A tiny 2-D incompressible fluid computer with vortex objects as persistent weights"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
mpri-gates = "mpri.gates:main"
mpri-organism = "mpri.organism_demo:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
